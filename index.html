<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
   <header class="main-header">
  <!-- Leftmost Side: Logo -->
  <div class="header-logo">
    <a href="#">
      <img src="./logo.jpeg" alt="loading" class="logo-icon">
      <span>P-S</span>
    </a>
  </div>

  <!-- Middle Side: Centered Title -->
  <div class="header-title">
    <h1>PAY-SHIELD</h1>
  </div>

  <!-- Rightmost Side: Dropdown Menu -->
  <div class="header-dropdown">
    <button class="dropdown-btn" aria-haspopup="true" aria-expanded="false">
      Account
      <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    
    <div class="dropdown-menu">
      <a href="#login">Profile</a>
      <a href="#settings">Settings</a>
      <a href="#dashboard">Dashboard</a>
      <hr>
      <a href="#logout" class="logout-link">Log Out</a>
    </div>
  </div>
</header>

<div class="stats-card">
  <div class="stats-card-header">
    <div class="stats-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div>
      <h2 class="stats-title">Global Payment Fraud Impact</h2>
      <p class="stats-subtitle">Industry benchmarks & metrics</p>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-item">
      <span class="stat-value">$48.0B</span>
      <span class="stat-label">Global Annual E-Commerce Losses</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">$131B</span>
      <span class="stat-label">projections climbing by 2030</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">76%</span>
      <span class="stat-label">Businesses Targeted Worldwide</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">36%</span>
      <span class="stat-label">First-Party / Friendly Fraud Share</span>
    </div>
  </div>
</div>


<footer>
    <div class="footer">
        <img src="./logo.jpeg" alt="loading" id="footer-logo">
        <p id="foot-p">PAY-SHIELD</p>
        <P id="copyright">&copy</P>
        <a href="payshield@gmail.com" id="foot-mail">payshield@gmail.com</a>
    </div>
</footer>

   
</body>
</html>
